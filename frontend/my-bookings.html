<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings | DriveX</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ================================
           MY BOOKINGS PAGE
        ================================= */

        .bookings-page {
            min-height: 75vh;
            padding: 50px 7%;
            background: #f8fafc;
        }


        /* ================================
           PAGE HEADER
        ================================= */

        .bookings-header {
            text-align: center;
            margin-bottom: 40px;
        }


        .bookings-header .small-title {
            color: #2563eb;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }


        .bookings-header h1 {
            font-size: 38px;
            color: #0f172a;
            margin-bottom: 10px;
        }


        .bookings-header p {
            color: #64748b;
            font-size: 16px;
        }


        /* ================================
           BOOKING CARD
        ================================= */

        .booking-list {
            max-width: 1050px;
            margin: auto;

            display: flex;
            flex-direction: column;
            gap: 25px;
        }


        .booking-card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            display: grid;

            grid-template-columns: 180px 1fr auto;

            gap: 25px;

            align-items: center;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.08);

            border: 1px solid #e2e8f0;

            transition: 0.3s;
        }


        .booking-card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 35px rgba(15, 23, 42, 0.12);
        }


        /* ================================
           CAR IMAGE
        ================================= */

        .booking-car {

            height: 130px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #eff6ff
                );

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 65px;
        }


        /* ================================
           BOOKING INFORMATION
        ================================= */

        .booking-info h2 {

            color: #0f172a;

            font-size: 22px;

            margin-bottom: 5px;
        }


        .booking-info .car-type {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 18px;
        }


        .booking-details {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px 25px;
        }


        .detail {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 14px;

            color: #475569;
        }


        .detail strong {

            color: #0f172a;
        }


        /* ================================
           STATUS
        ================================= */

        .booking-status {

            text-align: right;

            min-width: 130px;
        }


        .status {

            display: inline-block;

            padding: 7px 14px;

            border-radius: 20px;

            background: #dcfce7;

            color: #166534;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 15px;
        }


        .booking-price {

            font-size: 22px;

            font-weight: 800;

            color: #2563eb;

            margin-bottom: 3px;
        }


        .price-label {

            color: #94a3b8;

            font-size: 12px;
        }


        /* ================================
           EMPTY BOOKING
        ================================= */

        .no-bookings {

            display: none;

            max-width: 650px;

            margin: 50px auto;

            text-align: center;

            background: white;

            padding: 50px 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.08);
        }


        .no-bookings-icon {

            font-size: 65px;

            margin-bottom: 15px;
        }


        .no-bookings h2 {

            color: #0f172a;

            margin-bottom: 10px;
        }


        .no-bookings p {

            color: #64748b;

            margin-bottom: 25px;
        }


        .browse-btn {

            display: inline-block;

            padding: 13px 25px;

            background: #2563eb;

            color: white;

            border-radius: 9px;

            text-decoration: none;

            font-weight: 700;

            transition: 0.3s;
        }


        .browse-btn:hover {

            background: #1d4ed8;

            transform: translateY(-2px);
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 850px) {

            .booking-card {

                grid-template-columns: 140px 1fr;
            }


            .booking-status {

                grid-column: 2;

                text-align: left;
            }
        }


        @media (max-width: 600px) {

            .bookings-page {

                padding: 35px 20px;
            }


            .bookings-header h1 {

                font-size: 30px;
            }


            .booking-card {

                grid-template-columns: 1fr;

                gap: 18px;
            }


            .booking-car {

                height: 160px;
            }


            .booking-status {

                grid-column: auto;

                text-align: left;
            }


            .booking-details {

                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


    <!-- ================================
         NAVBAR
    ================================= -->

    <nav class="navbar">

        <div class="logo">
            🚘 DriveX
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="cars.html">
                Cars
            </a>

            <a href="my-bookings.html">
                My Bookings
            </a>

            <a href="#">
                About
            </a>

        </div>


        <div class="nav-buttons">

            <a href="login.html"
               class="login-btn-nav">
                Login
            </a>

            <a href="register.html"
               class="signup-btn-nav">
                Sign Up
            </a>

        </div>

    </nav>


    <!-- ================================
         MY BOOKINGS
    ================================= -->

    <main class="bookings-page">


        <!-- HEADER -->

        <div class="bookings-header">

            <div class="small-title">
                YOUR JOURNEY
            </div>

            <h1>
                My Bookings
            </h1>

            <p>
                View and manage your car rental bookings.
            </p>

        </div>


        <!-- BOOKING LIST -->

        <div class="booking-list" id="bookingList"></div>
        <!-- NO BOOKINGS -->

        <div class="no-bookings">

            <div class="no-bookings-icon">
                🚗
            </div>

            <h2>
                No Bookings Yet
            </h2>

            <p>
                You haven't booked a car yet.
                Start your journey today!
            </p>

            <a href="cars.html"
               class="browse-btn">
                Browse Cars →
            </a>

        </div>


    </main>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="footer">

        <div class="footer-content">

            <h3>
                🚘 DriveX
            </h3>

            <p>
                Your journey. Our cars.
            </p>

            <p>
                © 2026 DriveX. All Rights Reserved.
            </p>

        </div>

    </footer>

<script>

    const bookingList = document.getElementById("bookingList");
    const noBookings = document.querySelector(".no-bookings");

    fetch("http://localhost:8080/api/bookings")
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load bookings");
            }

            return response.json();
        })
        .then(bookings => {

            console.log("Bookings received:", bookings);

            if (bookings.length === 0) {
                bookingList.innerHTML = "";
                noBookings.style.display = "block";
                return;
            }

            bookingList.innerHTML = "";

            bookings.forEach(booking => {

                const card = document.createElement("div");

                card.className = "booking-card";

                card.innerHTML = `
                    <div class="booking-car">
                        🚘
                    </div>

                    <div class="booking-info">

                        <h2>
                            Car ID: ${booking.carId}
                        </h2>

                        <div class="car-type">
                            DriveX Rental
                        </div>

                        <div class="booking-details">

                            <div class="detail">
                                📅
                                <span>
                                    Pickup:
                                    <strong>${booking.pickupDate}</strong>
                                </span>
                            </div>

                            <div class="detail">
                                📅
                                <span>
                                    Return:
                                    <strong>${booking.returnDate}</strong>
                                </span>
                            </div>

                            <div class="detail">
                                📍
                                <span>
                                    ${booking.pickupLocation}
                                </span>
                            </div>

                            <div class="detail">
                                🎫
                                <span>
                                    Booking ID:
                                    <strong>DX${String(booking.id).padStart(4, "0")}</strong>
                                </span>
                            </div>

                        </div>

                    </div>

                    <div class="booking-status">

                        <div class="status">
                            Confirmed
                        </div>

                        <div class="booking-price">
                            ₹${booking.totalPrice.toLocaleString("en-IN")}
                        </div>

                        <div class="price-label">
                            Total Amount
                        </div>

                    </div>
                `;

                bookingList.appendChild(card);


                fetch("http://localhost:8080/api/cars/" + booking.carId)
                .then(response => response.json())
                .then(car => {
                 card.querySelector(".booking-info h2").textContent = car.name;
                   })
                   
             .catch(error => {
               console.error("Error loading car name:", error);
                });
            });

        })
        .catch(error => {

            console.error("Error loading bookings:", error);

        });

</script>
</body>

</html>
